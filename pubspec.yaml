name: nova
description: Nova — a formal voice companion for Android and iOS.
publish_to: 'none'
version: 1.2.4+16

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  device_calendar: ^4.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  record: ^5.2.1
  just_audio: ^0.9.42
  flutter_tts: 3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
